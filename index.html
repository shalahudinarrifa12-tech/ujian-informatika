<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Tes Formatif Informatika</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #4f46e5;
      --primary-dark: #4338ca;
      --secondary: #06b6d4;
      --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
      --card-bg: rgba(255, 255, 255, 0.96);
      --text-main: #1e293b;
      --text-muted: #64748b;
      --danger: #ef4444;
      --success: #10b981;
      --warning: #f59e0b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Poppins', sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background: var(--bg-gradient);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      color: var(--text-main);
      padding: 12px;
    }

    .container {
      width: 100%;
      max-width: 800px;
      background: var(--card-bg);
      border-radius: 20px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .screen {
      display: none;
      padding: 30px;
      flex-direction: column;
    }

    .screen.active {
      display: flex;
    }

    .login-header {
      text-align: center;
      margin-bottom: 25px;
    }

    .login-header h2 {
      font-size: clamp(1.4rem, 4vw, 1.8rem);
      color: var(--primary-dark);
      font-weight: 700;
    }

    .login-header p {
      color: var(--text-muted);
      font-size: 0.9rem;
      margin-top: 5px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-group label {
      display: block;
      margin-bottom: 6px;
      font-weight: 600;
      font-size: 0.85rem;
      color: var(--text-main);
    }

    .form-control {
      width: 100%;
      padding: 12px 16px;
      border: 2px solid #e2e8f0;
      border-radius: 10px;
      font-size: 0.95rem;
      transition: all 0.3s;
    }

    .form-control:focus {
      border-color: var(--primary);
      outline: none;
      box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
    }

    .btn {
      width: 100%;
      padding: 14px;
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
      box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3);
    }

    .btn:hover {
      background: var(--primary-dark);
      transform: translateY(-1px);
    }

    .exam-header {
      background: #f8fafc;
      padding: 15px 25px;
      border-bottom: 2px solid #e2e8f0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }

    .exam-title h3 {
      font-size: clamp(1rem, 3.5vw, 1.2rem);
      color: var(--primary-dark);
    }

    .exam-title p {
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .timer-badge {
      background: #fee2e2;
      color: var(--danger);
      padding: 8px 16px;
      border-radius: 30px;
      font-weight: 700;
      font-size: 0.95rem;
      display: flex;
      align-items: center;
      gap: 6px;
      border: 1px solid #fca5a5;
    }

    .instructions-list {
      background: #f1f5f9;
      padding: 20px;
      border-radius: 12px;
      margin: 15px 0;
      list-style-position: inside;
      line-height: 1.7;
      font-size: 0.9rem;
    }

    .instructions-list li {
      margin-bottom: 8px;
    }

    .question-container {
      padding: 25px 30px;
      min-height: 320px;
    }

    .question-text {
      font-size: clamp(0.95rem, 3vw, 1.05rem);
      font-weight: 600;
      line-height: 1.6;
      margin-bottom: 20px;
      white-space: pre-line;
    }

    .options-container {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .option-btn {
      display: flex;
      align-items: center;
      padding: 12px 16px;
      border: 2px solid #e2e8f0;
      border-radius: 10px;
      background: #fff;
      cursor: pointer;
      transition: all 0.2s;
      font-size: 0.9rem;
      line-height: 1.4;
    }

    .option-btn:hover {
      border-color: #cbd5e1;
      background: #f8fafc;
    }

    .option-btn.selected {
      border-color: var(--primary);
      background: #eef2ff;
      color: var(--primary-dark);
      font-weight: 600;
    }

    .option-tag {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: #e2e8f0;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-right: 12px;
      font-weight: 600;
      font-size: 0.8rem;
      flex-shrink: 0;
    }

    .option-btn.selected .option-tag {
      background: var(--primary);
      color: #fff;
    }

    .exam-footer {
      padding: 15px 30px;
      background: #f8fafc;
      border-top: 1px solid #e2e8f0;
      display: flex;
      justify-content: space-between;
      gap: 15px;
    }

    .btn-nav {
      width: auto;
      padding: 10px 24px;
      font-size: 0.9rem;
    }

    .btn-secondary {
      background: #64748b;
    }

    .btn-secondary:hover {
      background: #475569;
    }

    .btn-success {
      background: var(--success);
    }

    .btn-success:hover {
      background: #059669;
    }

    .result-box {
      text-align: center;
      padding: 30px 10px;
    }

    .result-score {
      font-size: 3.5rem;
      font-weight: 800;
      color: var(--primary);
      margin: 15px 0;
    }

      display: inline-block;

      border-
